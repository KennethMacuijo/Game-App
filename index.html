<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Arena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="arena">
        <div class="arena-background"></div>

        <!-- Game Mode Selection -->
        <div id="mode-selection" class="mode-selection">
            <h1>Rock Paper Scissors Arena</h1>
            <div class="mode-buttons">
                <button class="mode-btn" id="vs-computer">VS Computer</button>
                <button class="mode-btn" id="vs-player">VS Player</button>
            </div>
        </div>

        <!-- Game UI -->
        <div id="game-ui" class="game-ui hidden">
            <!-- Round Info -->
            <div class="round-info">
                <div class="round-display">Round <span id="current-round">1</span> of <span id="total-rounds">3</span></div>
                <div class="timer-display">
                    <div class="timer-bar">
                        <div class="timer-fill" id="timer-fill"></div>
                    </div>
                    <div class="timer-text">Time: <span id="timer-count">10</span>s</div>
                </div>
            </div>

            <!-- Players -->
            <div class="players-container">
                <div class="player player1">
                    <div class="player-avatar">
                        <div class="avatar-circle" id="player1-avatar">👤</div>
                    </div>
                    <div class="player-info">
                        <h3 id="player1-name">Player 1</h3>
                        <div class="player-score" id="player1-score">0</div>
                    </div>
                    <div class="player-choices" id="player1-choices">
                        <div class="choice-btn" data-choice="rock">🪨</div>
                        <div class="choice-btn" data-choice="paper">📄</div>
                        <div class="choice-btn" data-choice="scissors">✂️</div>
                    </div>
                </div>

                <div class="vs-indicator">
                    <div class="vs-text">VS</div>
                    <div class="round-winner" id="round-winner"></div>
                </div>

                <div class="player player2">
                    <div class="player-avatar">
                        <div class="avatar-circle" id="player2-avatar">🤖</div>
                    </div>
                    <div class="player-info">
                        <h3 id="player2-name">Computer</h3>
                        <div class="player-score" id="player2-score">0</div>
                    </div>
                    <div class="player-choices" id="player2-choices">
                        <div class="choice-btn" data-choice="rock">🪨</div>
                        <div class="choice-btn" data-choice="paper">📄</div>
                        <div class="choice-btn" data-choice="scissors">✂️</div>
                    </div>
                </div>
            </div>

            <!-- Battle Arena -->
            <div class="battle-arena">
                <div class="arena-center">
                    <div class="battle-result" id="battle-result">
                        <div class="result-text" id="result-text">Choose your weapon!</div>
                        <div class="result-icons">
                            <div class="result-icon" id="player1-choice-display"></div>
                            <div class="vs-battle">⚔️</div>
                            <div class="result-icon" id="player2-choice-display"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Game Status -->
            <div class="game-status">
                <div class="status-message" id="status-message">First player to make a choice!</div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over" class="game-over hidden">
                <div class="game-over-content">
                    <h2 id="game-over-title">🏆 Victory!</h2>
                    <div class="final-scores">
                        <div class="final-score">
                            <span id="final-player1-name">Player 1</span>: <span id="final-player1-score">0</span>
                        </div>
                        <div class="final-score">
                            <span id="final-player2-name">Computer</span>: <span id="final-player2-score">0</span>
                        </div>
                    </div>
                    <button class="play-again-btn" id="play-again">Play Again</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
